name: Ardour macOS Intel Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Prevent concurrent runs from overwriting each other
concurrency:
  group: ardour-macos-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ardour (Intel macOS)
    runs-on: macos-15-intel
    timeout-minutes: 180          # full dependency + compile can take a while

    env:
      # Intel Homebrew lives under /usr/local
      HOMEBREW_PREFIX: /usr/local
      # Make sure we use the Intel Homebrew binary
      PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
      # Avoid interactive prompts
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1

    steps:
      - name: Checkout this repository (CI file only)
        uses: actions/checkout@v4

      - name: Clone latest Ardour source
        run: |
          git clone --depth 1 https://github.com/Ardour/ardour.git src
          cd src
          echo "Ardour commit: $(git rev-parse --short HEAD)"
          echo "ARDOUR_GIT_REV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Install Xcode Command Line Tools (safety)
        run: |
          # The runner already has them, but make sure
          xcode-select -p || sudo xcode-select --install || true
          clang --version
          python3 --version

      - name: Update Homebrew and install dependencies
        run: |
          brew update

          # Core build tools
          brew install \
            pkgconf \
            python@3.12 \
            boost \
            cmake \
            ninja \
            meson \
            autoconf \
            automake \
            libtool \
            itstool \
            gettext

          # Audio / media libraries
          brew install \
            libsndfile \
            libarchive \
            liblo \
            taglib \
            vamp-plugin-sdk \
            rubberband \
            libusb \
            jack \
            fftw \
            aubio \
            libsamplerate \
            flac \
            libogg \
            libvorbis \
            libxml2 \
            curl \
            libwebsockets \
            libltc \
            hidapi \
            suil

          # LV2 stack
          brew install \
            lv2 \
            serd \
            sord \
            sratom \
            lilv \
            lrdf \
            raptor \
            redland

          # GTK2 / gtkmm 2.x stack (versioned formulae required)
          brew install \
            gtk+ \
            gtkmm \
            glib \
            glibmm@2.66 \
            libsigc++@2 \
            cairomm@1.14 \
            pangomm@2.46 \
            atkmm@2.28 \
            pango \
            cairo \
            gdk-pixbuf \
            harfbuzz \
            libpng \
            jpeg \
            readline

          # Optional / useful
          brew install cppunit

      - name: Link keg-only formulae and set environment
        run: |
          # Force-link the versioned packages that Ardour needs
          brew link --force --overwrite glibmm@2.66 || true
          brew link --force --overwrite libsigc++@2 || true
          brew link --force --overwrite cairomm@1.14 || true
          brew link --force --overwrite pangomm@2.46 || true
          brew link --force --overwrite atkmm@2.28 || true
          brew link --force --overwrite libarchive || true   # often keg-only

          # Python symlink for waf (expects "python")
          ln -sf "$(brew --prefix python@3.12)/bin/python3.12" /usr/local/bin/python || true
          ln -sf "$(brew --prefix python@3.12)/bin/python3.12" /usr/local/bin/python3 || true

          # Export paths so pkg-config and the compiler find everything
          {
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/opt/libarchive/lib/pkgconfig:/usr/local/opt/glibmm@2.66/lib/pkgconfig:/usr/local/opt/libsigc++@2/lib/pkgconfig:/usr/local/opt/cairomm@1.14/lib/pkgconfig:/usr/local/opt/pangomm@2.46/lib/pkgconfig:/usr/local/opt/atkmm@2.28/lib/pkgconfig"
            echo "CPLUS_INCLUDE_PATH=/usr/local/include:/usr/local/opt/boost/include"
            echo "LIBRARY_PATH=/usr/local/lib"
            echo "LDFLAGS=-L/usr/local/lib -L/usr/local/opt/libarchive/lib"
            echo "CPPFLAGS=-I/usr/local/include -I/usr/local/opt/libarchive/include -I/usr/local/opt/boost/include"
            echo "PATH=/usr/local/bin:/usr/local/sbin:/usr/local/opt/python@3.12/bin:$PATH"
          } >> $GITHUB_ENV

      - name: Verify critical pkg-config modules
        run: |
          pkg-config --exists glib-2.0 && echo "glib OK"
          pkg-config --exists glibmm-2.4 && echo "glibmm OK"
          pkg-config --exists gtkmm-2.4 && echo "gtkmm OK"
          pkg-config --exists sigc++-2.0 && echo "sigc++ OK"
          pkg-config --exists cairomm-1.0 && echo "cairomm OK"
          pkg-config --exists pangomm-1.4 && echo "pangomm OK"
          pkg-config --exists lilv-0 && echo "lilv OK"
          pkg-config --exists sndfile && echo "libsndfile OK"
          pkg-config --modversion gtkmm-2.4

      - name: Configure Ardour
        working-directory: src
        run: |
          # Use python3 explicitly (waf is a Python script)
          python3 ./waf configure \
            --strict \
            --optimize \
            --ptformat \
            --with-backends=coreaudio,dummy,jack \
            --prefix=/usr/local

      - name: Build Ardour
        working-directory: src
        run: |
          python3 ./waf -j$(sysctl -n hw.logicalcpu)
          python3 ./waf i18n

      - name: Install into the build tree (needed by packaging)
        working-directory: src
        run: |
          python3 ./waf install

      - name: Package macOS application bundle + DMG
        working-directory: src/tools/osx_packaging
        run: |
          # The official script looks for a private GTK stack first.
          # We point it at the Homebrew prefix so it can still find dylibs.
          export GTKSTACK_ROOT=/usr/local
          export BUILD_ROOT=../../build

          # --public produces a redistributable DMG; --nls includes translations
          bash ./osx_build --nls --public || {
            echo "osx_build returned non-zero – checking for partial output…"
            ls -la
            # Continue so we still upload whatever was produced
            true
          }

          # List what was produced
          ls -lh *.dmg *.app 2>/dev/null || true
          find . -name "*.dmg" -o -name "Ardour*.app" | head -20

      - name: Upload Ardour DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-macOS-Intel-${{ env.ARDOUR_GIT_REV }}
          path: |
            src/tools/osx_packaging/*.dmg
            src/tools/osx_packaging/Ardour*.app
          if-no-files-found: warn
          retention-days: 14
