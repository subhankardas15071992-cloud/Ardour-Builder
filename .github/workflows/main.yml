name: Build Ardour - macOS Intel (x86_64) Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Intel macOS runner (x86_64). On Intel macOS Homebrew is installed at /usr/local
    # (Apple Silicon uses /opt/homebrew - do NOT use that prefix here).
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    env:
      ARDOUR_REPO: https://github.com/Ardour/ardour.git
      ARDOUR_DIR: ${{ github.workspace }}/ardour
      # Intel macOS Homebrew prefix
      HOMEBREW_PREFIX: /usr/local
    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout the repository that holds this CI file (an empty repo is fine
      #    - this workflow clones Ardour itself in a later step).
      # -------------------------------------------------------------------------
      - name: Checkout CI repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. Xcode command-line tools (clang, make, headers, etc.)
      # -------------------------------------------------------------------------
      - name: Install Xcode command-line tools
        run: xcode-select --install || true

      # -------------------------------------------------------------------------
      # 3. Homebrew package manager (Intel prefix /usr/local)
      # -------------------------------------------------------------------------
      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "${HOMEBREW_PREFIX}/bin" >> $GITHUB_PATH

      # -------------------------------------------------------------------------
      # 4. Install Ardour's build dependencies via Homebrew.
      #
      #    Every package name below was cross-checked against
      #    https://formulae.brew.sh/api/formula.json (and the cask API) on
      #    2026-10-26 so that dependencies are sourced under their correct
      #    Homebrew names.
      #
      #    Ardour build requisites (from wscript / gtk2_ardour/wscript /
      #    libs/*/wscript pkg-config checks):
      #      glib glibmm libsndfile liblo taglib rubberband libusb boost jack
      #      gettext fftw flac libogg pango fontconfig aubio libxml2 lrdf
      #      libsamplerate libsigc++@2 lv2 serd sord sratom lilv cairo
      #    vamp-plugin-sdk provides both vamp-sdk.pc and vamp-hostsdk.pc.
      #    Build tools: pkgconf cmake meson ninja
      #
      #    NOTE on linking (Intel macOS): curl, libarchive and libxml2 are
      #    keg-only on macOS (shadowed by the system copies), so their
      #    pkg-config files are not on the default search path. The next step
      #    adds /usr/local/opt/<pkg>/lib/pkgconfig explicitly so waf finds the
      #    Homebrew (newer) versions that satisfy Ardour's minimum versions.
      # -------------------------------------------------------------------------
      - name: Install Ardour build dependencies via Homebrew
        run: |
          brew update
          brew install \
            glib glibmm libsndfile liblo taglib rubberband \
            libusb boost jack gettext \
            fftw flac libogg pango fontconfig \
            aubio libxml2 lrdf libsamplerate libsigc++@2 \
            lv2 serd sord sratom lilv cairo \
            vamp-plugin-sdk \
            pkgconf cmake meson ninja

      # -------------------------------------------------------------------------
      # 5. Point pkg-config (and linker) at Homebrew keg-only libraries.
      # -------------------------------------------------------------------------
      - name: Configure pkg-config / linker paths for keg-only libs
        run: |
          echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/curl/lib/pkgconfig:${HOMEBREW_PREFIX}/opt/libarchive/lib/pkgconfig:${HOMEBREW_PREFIX}/opt/libxml2/lib/pkgconfig:${HOMEBREW_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          echo "LDFLAGS=-L${HOMEBREW_PREFIX}/opt/curl/lib -L${HOMEBREW_PREFIX}/opt/libarchive/lib -L${HOMEBREW_PREFIX}/opt/libxml2/lib -L${HOMEBREW_PREFIX}/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${HOMEBREW_PREFIX}/opt/curl/include -I${HOMEBREW_PREFIX}/opt/libarchive/include -I${HOMEBREW_PREFIX}/opt/libxml2/include -I${HOMEBREW_PREFIX}/include" >> $GITHUB_ENV

      # -------------------------------------------------------------------------
      # 6. Clone Ardour's latest code to the CI runner.
      # -------------------------------------------------------------------------
      - name: Clone Ardour source (latest master)
        run: |
          git clone --depth 1 --single-branch -b master "${ARDOUR_REPO}" "${ARDOUR_DIR}"

      # -------------------------------------------------------------------------
      # 7. Configure Ardour with waf.
      #    macOS: CoreAudio is the native audio backend. x86_64 is the native
      #    arch of macos-15-intel, so no --arch flag is required.
      #
      #    Prerequisite note (cross-checked against Homebrew):
      #      Ardour's wscript mandatorily checks for giomm-2.4.pc
      #      (check_pkg 'giomm-2.4', mandatory=True). On Homebrew, giomm is
      #      provided by the glibmm formula (already installed above), so the
      #      giomm-2.4.pc file is available. vamp-sdk and vamp-hostsdk are both
      #      covered by the vamp-plugin-sdk formula above.
      # -------------------------------------------------------------------------
      - name: Configure Ardour (waf)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          python3 ./waf configure \
            --with-backends=coreaudio \
            --prefix="${ARDOUR_DIR}/install" \
            2>&1 | tee configure.log

      # -------------------------------------------------------------------------
      # 8. Build Ardour (Release, x86_64).
      # -------------------------------------------------------------------------
      - name: Build Ardour (Release)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          python3 ./waf build -j$(sysctl -n hw.ncpu)

      # -------------------------------------------------------------------------
      # 9. Assemble the Ardour.app bundle from the built binary, mirroring the
      #    structure produced by Ardour's tools/osx_packaging/osx_build:
      #      Ardour.app/
      #        Contents/
      #          Info.plist
      #          PkgInfo
      #          MacOS/Ardour          <- built executable
      #          Resources/appIcon.icns
      # -------------------------------------------------------------------------
      - name: Assemble Ardour.app bundle
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          set -e
          # Locate the built executable (gtk2_ardour/ardour-<VERSION>)
          EXE=$(ls gtk2_ardour/ardour-* 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::Built Ardour executable not found in gtk2_ardour/"
            exit 1
          fi
          VERSION=$(basename "$EXE" | sed 's/^ardour-//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          APP="Ardour.app"
          rm -rf "${APP}"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          # executable
          cp "${EXE}" "${APP}/Contents/MacOS/Ardour"
          chmod +x "${APP}/Contents/MacOS/Ardour"

          # PkgInfo (4-char signature + 4-char creator code)
          printf 'APPLArdr' > "${APP}/Contents/PkgInfo"

          # Info.plist (heredoc body is indented to match this run block; GitHub
          # Actions strips the common leading indentation before handing the
          # script to bash, so ${VERSION} below is expanded at runtime).
          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>Ardour</string>
            <key>CFBundleIconFile</key><string>appIcon.icns</string>
            <key>CFBundleIdentifier</key><string>org.ardour.ardour</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Ardour</string>
            <key>CFBundleDisplayName</key><string>Ardour</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # app icon (from Ardour's packaging resources)
          if [ -f tools/osx_packaging/Ardour.icns ]; then
            cp tools/osx_packaging/Ardour.icns "${APP}/Contents/Resources/appIcon.icns"
          fi

          echo "Ardour.app assembled:"
          find "${APP}" -maxdepth 3 | sort

      # -------------------------------------------------------------------------
      # 10. Build the installer disk image (.dmg) for macOS Intel.
      # -------------------------------------------------------------------------
      - name: Create installer disk image (.dmg)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          hdiutil create -srcfolder Ardour.app \
            -volname "Ardour ${VERSION}" \
            -ov -format UDZO "Ardour-${VERSION}-macos-x86_64.dmg"
          ls -lh *.dmg

      # -------------------------------------------------------------------------
      # 11. Publish the installer as a downloadable artifact.
      # -------------------------------------------------------------------------
      - name: Upload macOS Intel installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-x86_64-installer
          path: ${{ env.ARDOUR_DIR }}/Ardour-${{ env.VERSION }}-macos-x86_64.dmg
          retention-days: 30
