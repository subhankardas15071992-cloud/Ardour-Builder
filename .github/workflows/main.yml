name: Build Ardour - macOS Intel (x86_64) Installer via MacPorts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Intel macOS runner (x86_64). Homebrew does NOT support Intel macOS
    # (the official installer aborts: "Homebrew on macOS is only supported on
    # Apple Silicon processors!"), so MacPorts is used instead. MacPorts
    # installs to /opt/local on Intel macOS.
    #
    # NOTE: runner label must be exactly "macos-15-intel" (case-sensitive).
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
    env:
      ARDOUR_REPO: https://github.com/Ardour/ardour.git
      ARDOUR_DIR: ${{ github.workspace }}/ardour
      # MacPorts prefix on Intel macOS
      MACPORTS_PREFIX: /opt/local
    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout the repository that holds this CI file (an empty repo is fine
      #    - this workflow clones Ardour itself in a later step).
      # -------------------------------------------------------------------------
      - name: Checkout CI repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. Xcode command-line tools (clang, make, headers, etc.)
      # -------------------------------------------------------------------------
      - name: Install Xcode command-line tools
        run: xcode-select --install || true

      # -------------------------------------------------------------------------
      # 3. Install MacPorts (Intel macOS prefix /opt/local).
      #
      #    The MacPorts .pkg for macOS 15 Sequoia must be downloaded from the
      #    MacPorts project. Verify the exact package URL for macOS 15 / Intel
      #    at https://github.com/macports/macports-base/releases and update the
      #    URL below if it changes.
      # -------------------------------------------------------------------------
      - name: Install MacPorts
        run: |
          # macOS 15 (Sequoia), Intel (x86_64) MacPorts installer package
          curl -fsSL -o MacPorts.pkg \
            "https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg"
          sudo installer -pkg MacPorts.pkg -target /
          echo "${MACPORTS_PREFIX}/bin" >> $GITHUB_PATH
          echo "${MACPORTS_PREFIX}/sbin" >> $GITHUB_PATH

      # -------------------------------------------------------------------------
      # 4. Sync MacPorts ports tree.
      # -------------------------------------------------------------------------
      - name: Sync MacPorts
        run: |
          sudo port selfupdate

      # -------------------------------------------------------------------------
      # 5. Install Ardour's build dependencies via MacPorts.
      #
      #    Port names verified against https://ports.macports.org/search/
      #    (checked 2026-10-26). Ardour build requisites (from wscript /
      #    gtk2_ardour/wscript / libs/*/wscript pkg-config checks):
      #
      #      glib2 glibmm libsndfile liblo taglib rubberband libusb boost jack
      #      gettext fftw-3 flac libogg pango fontconfig aubio libxml2
      #      libsamplerate cairo serd sord sratom lv2 lilv curl libarchive
      #
      #    Build tools supplied by MacPorts: pkgconf cmake meson ninja
      #
      #    KNOWN GAPS (mandatory Ardour checks NOT available as MacPorts ports):
      #      - giomm-2.4.pc  -> no "giomm" port on MacPorts (glibmm is installed
      #        above but may not ship giomm-2.4.pc)
      #      - lrdf          -> no "lrdf" port on MacPorts
      #      - sigc++-2.0    -> no "libsigc++2" port on MacPorts
      #      - vamp-sdk / vamp-hostsdk -> no "vamp-plugin-sdk" port on MacPorts
      #
      #    Because Ardour's wscript checks these as mandatory=True,
      #    `./waf configure` will stop at the first missing one. These would
      #    need to be built from source or the wscript checks relaxed before
      #    the build can complete on MacPorts.
      # -------------------------------------------------------------------------
      - name: Install Ardour build dependencies via MacPorts
        run: |
          sudo port install \
            glib2 glibmm libsndfile liblo taglib rubberband \
            libusb boost jack gettext \
            fftw-3 flac libogg pango fontconfig \
            aubio libxml2 libsamplerate cairo \
            serd sord sratom lv2 lilv curl libarchive \
            pkgconf cmake meson ninja

      # -------------------------------------------------------------------------
      # 6. Point pkg-config (and linker) at MacPorts.
      # -------------------------------------------------------------------------
      - name: Configure pkg-config / linker paths for MacPorts
        run: |
          echo "PKG_CONFIG_PATH=${MACPORTS_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV
          echo "LDFLAGS=-L${MACPORTS_PREFIX}/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${MACPORTS_PREFIX}/include" >> $GITHUB_ENV

      # -------------------------------------------------------------------------
      # 7. Clone Ardour's latest code to the CI runner.
      # -------------------------------------------------------------------------
      - name: Clone Ardour source (latest master)
        run: |
          git clone --depth 1 --single-branch -b master "${ARDOUR_REPO}" "${ARDOUR_DIR}"

      # -------------------------------------------------------------------------
      # 8. Configure Ardour with waf.
      #    macOS: CoreAudio is the native audio backend. x86_64 is the native
      #    arch of macos-15-intel, so no --arch flag is required.
      #
      #    See step 5 for the known mandatory-dependency gaps on MacPorts that
      #    will cause waf configure to fail until resolved.
      # -------------------------------------------------------------------------
      - name: Configure Ardour (waf)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          python3 ./waf configure \
            --with-backends=coreaudio \
            --prefix="${ARDOUR_DIR}/install" \
            2>&1 | tee configure.log

      # -------------------------------------------------------------------------
      # 9. Build Ardour (Release, x86_64).
      # -------------------------------------------------------------------------
      - name: Build Ardour (Release)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          python3 ./waf build -j$(sysctl -n hw.ncpu)

      # -------------------------------------------------------------------------
      # 10. Assemble the Ardour.app bundle from the built binary, mirroring the
      #     structure produced by Ardour's tools/osx_packaging/osx_build:
      #       Ardour.app/
      #         Contents/
      #           Info.plist
      #           PkgInfo
      #           MacOS/Ardour          <- built executable
      #           Resources/appIcon.icns
      # -------------------------------------------------------------------------
      - name: Assemble Ardour.app bundle
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          set -e
          # Locate the built executable (gtk2_ardour/ardour-<VERSION>)
          EXE=$(ls gtk2_ardour/ardour-* 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::Built Ardour executable not found in gtk2_ardour/"
            exit 1
          fi
          VERSION=$(basename "$EXE" | sed 's/^ardour-//')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          APP="Ardour.app"
          rm -rf "${APP}"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          # executable
          cp "${EXE}" "${APP}/Contents/MacOS/Ardour"
          chmod +x "${APP}/Contents/MacOS/Ardour"

          # PkgInfo (4-char signature + 4-char creator code)
          printf 'APPLArdr' > "${APP}/Contents/PkgInfo"

          # Info.plist (heredoc body is indented to match this run block; GitHub
          # Actions strips the common leading indentation before handing the
          # script to bash, so ${VERSION} below is expanded at runtime).
          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>Ardour</string>
            <key>CFBundleIconFile</key><string>appIcon.icns</string>
            <key>CFBundleIdentifier</key><string>org.ardour.ardour</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Ardour</string>
            <key>CFBundleDisplayName</key><string>Ardour</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # app icon (from Ardour's packaging resources)
          if [ -f tools/osx_packaging/Ardour.icns ]; then
            cp tools/osx_packaging/Ardour.icns "${APP}/Contents/Resources/appIcon.icns"
          fi

          echo "Ardour.app assembled:"
          find "${APP}" -maxdepth 3 | sort

      # -------------------------------------------------------------------------
      # 11. Build the installer disk image (.dmg) for macOS Intel.
      # -------------------------------------------------------------------------
      - name: Create installer disk image (.dmg)
        working-directory: ${{ env.ARDOUR_DIR }}
        run: |
          hdiutil create -srcfolder Ardour.app \
            -volname "Ardour ${VERSION}" \
            -ov -format UDZO "Ardour-${VERSION}-macos-x86_64.dmg"
          ls -lh *.dmg

      # -------------------------------------------------------------------------
      # 12. Publish the installer as a downloadable artifact.
      # -------------------------------------------------------------------------
      - name: Upload macOS Intel installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-x86_64-installer
          path: ${{ env.ARDOUR_DIR }}/Ardour-${{ env.VERSION }}-macos-x86_64.dmg
          retention-days: 30
